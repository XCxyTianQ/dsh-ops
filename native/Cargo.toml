[package]
name = "dsh-ops-core"
version = "0.3.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dsh-ops-worker"
path = "src/main.rs"

[dependencies]
cap-std = "3.4"
cap-fs-ext = "3.4"
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
rustix = { version = "1.1", features = ["fs", "process"] }
sha2 = "0.10.9"
uuid = { version = "1.26", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

# OHOS: openat2 is killed by SIGSYS on HarmonyOS (no userspace fallback can
# observe it), so this ships cap-primitives 3.4.6 with an ENOSYS guard that
# routes every caller through the library's own `manually::open` fallback.
# Same crate version as upstream's lockfile; see vendor/cap-primitives.
[patch.crates-io]
cap-primitives = { path = "../vendor/cap-primitives" }
